spring.application.name=pawpets

# Railway entrega el puerto en PORT; en local se usa 8081.
server.port=${PORT:8081}

# Cadena de conexión de MongoDB Atlas. Se lee de la variable de entorno MONGODB_URI.
# Nunca escribir la cadena con la clave en este archivo.
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=pawpets

# Orígenes que pueden llamar a la API (frontend local y frontend publicado en Railway).
pawpets.cors.origenes=${CORS_ORIGENES:http://localhost:5173,https://caso3pawpetsfinal-production.up.railway.app}
